<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Invitation</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(to right, #fceabb, #f8b500);
      text-align: center;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 1.5em;
      margin-top: 0;
    }
    .details {
      background: #fff;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .rsvp {
      margin-top: 20px;
    }
    button {
      background: #f8b500;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    button:hover {
      background: #d89c00;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prateek & Aanya</h1>
    <h2>Are Getting Married!</h2>
    <p>Join us on <strong>15th December 2026</strong></p>
  </header>

  <div class="details">
    <h3>Venue</h3>
    <p>Royal Palace Banquet, Lucknow</p>
    <h3>Time</h3>
    <p>Reception starts at 6:00 PM</p>
    <h3>Dress Code</h3>
    <p>Traditional / Formal</p>
  </div>

  <div class="rsvp">
    <h3>RSVP</h3>
    <p>Please confirm your presence by clicking below:</p>
    <button onclick="window.location.href='https://forms.gle/yourGoogleFormLink'">Confirm Attendance</button>
  </div>
</body>
</html>
